# crexx-rag human configuration
# Current stable Google models verified against the official catalogue on 2026-08-24.
format = crexx-rag.config/3
config.id = google-gemini
config.version = 1
profiles = generic-profile,it-architecture-profile

source.architecture-docs.connector = folder
source.architecture-docs.root = ./source-docs
source.architecture-docs.include = **/*.md,**/*.txt,**/*.rexx,**/*.crexx
source.architecture-docs.stable_key = relative-path
source.architecture-docs.privacy = public
source.architecture-docs.retain_raw_artifact = true

provider.gemini-generate.kind = gemini
provider.gemini-generate.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-generate.model = gemini-3.5-flash-lite
provider.gemini-generate.route_class = hosted
provider.gemini-generate.privacy_policy = public-only
provider.gemini-generate.credential = env:GEMINI_API_KEY
provider.gemini-generate.timeout_ms = 60000
provider.gemini-generate.max_attempts = 3
provider.gemini-generate.requests_per_minute = 60
provider.gemini-generate.tokens_per_minute = 1000000
provider.gemini-generate.concurrent_requests = 2
provider.gemini-generate.initial_backoff_ms = 1000
provider.gemini-generate.maximum_backoff_ms = 60000
provider.gemini-generate.jitter_ms = 250
provider.gemini-generate.context_tokens = 1048576
provider.gemini-generate.maximum_output_tokens = 65536
provider.gemini-generate.embedding_dimensions_minimum = 0
provider.gemini-generate.embedding_dimensions_maximum = 0
provider.gemini-generate.maximum_batch_size = 1
provider.gemini-generate.input_price_microunits_per_million = 300000
provider.gemini-generate.output_price_microunits_per_million = 2500000
provider.gemini-generate.catalog_observed_date = 2026-08-24

provider.gemini-embed.kind = gemini
provider.gemini-embed.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-embed.model = gemini-embedding-2
provider.gemini-embed.route_class = hosted
provider.gemini-embed.privacy_policy = public-only
provider.gemini-embed.credential = env:GEMINI_API_KEY
provider.gemini-embed.timeout_ms = 60000
provider.gemini-embed.max_attempts = 3
provider.gemini-embed.requests_per_minute = 60
provider.gemini-embed.tokens_per_minute = 1000000
provider.gemini-embed.concurrent_requests = 2
provider.gemini-embed.initial_backoff_ms = 1000
provider.gemini-embed.maximum_backoff_ms = 60000
provider.gemini-embed.jitter_ms = 250
provider.gemini-embed.context_tokens = 8192
provider.gemini-embed.maximum_output_tokens = 0
provider.gemini-embed.embedding_dimensions_minimum = 128
provider.gemini-embed.embedding_dimensions_maximum = 3072
provider.gemini-embed.maximum_batch_size = 100
provider.gemini-embed.input_price_microunits_per_million = 200000
provider.gemini-embed.output_price_microunits_per_million = 0
provider.gemini-embed.catalog_observed_date = 2026-08-24

role.advisory.provider = gemini-generate
role.advisory.max_input_tokens = 65536
role.advisory.max_output_tokens = 4096
role.advisory.max_call_cost_microunits = 100000
role.advisory.temperature_millionths = 0
role.advisory.system_prompt = Summarize only the supplied cREXX-RAG library report context. Describe major subjects cautiously; do not claim completeness or turn health metrics into professional judgement. Every overview and subject must cite only citation IDs present in the supplied passages. Return the exact requested structure.
role.extractor.provider = gemini-generate
role.extractor.max_input_tokens = 8192
role.extractor.max_output_tokens = 4096
role.extractor.max_call_cost_microunits = 100000
role.extractor.temperature_millionths = 0
role.extractor.system_prompt = Discover zero or more concepts, directional typed relationships, and important grounded analysis notes in the supplied evidence. Return every directly supported relationship up to the stated bounds, not just one. Provide evidence_quote copied from the chunk for each mention, relationship and note; the application computes UTF-8 byte offsets. Mention labels must occur in their quotation; relationship quotations must contain both endpoint labels. Use only allowed concept and relationship types. Do not invent evidence. During maintenance, use the durable query-gap and prior-note context to investigate omissions and important follow-up work, but ground every returned note in a quotation from the supplied text. For synonym, split, merge, type-correction, retire or restore notes, next_action must be canonical compact JSON with schema crexx-rag.lifecycle-action/1 and exactly operation, concept_id, target_concept_id, alias, concept_type, successors, dispositions and reason. Use exact catalogue concept ids from the durable input. Initial split/merge suggestions use an empty dispositions array; maintenance later enumerates every affected object before any connection can move.
role.embedding.provider = gemini-embed
role.embedding.max_input_tokens = 8192
role.embedding.max_output_tokens = 0
role.embedding.max_call_cost_microunits = 1000
role.embedding.temperature_millionths = 0
role.embedding.dimensions = 768
role.embedding.batch_size = 100
role.answerer.provider = gemini-generate
role.answerer.max_input_tokens = 65536
role.answerer.max_output_tokens = 1024
role.answerer.max_call_cost_microunits = 100000
role.answerer.temperature_millionths = 0
role.answerer.system_prompt = Answer only from the supplied cREXX-RAG answer context. Preserve direction, ambiguity, conflict, time and gaps. Return grounding=supported when the evidence fully answers the question, or grounding=partial when it answers only part; both require only citation IDs present in the context. Return grounding=insufficient only when the evidence answers none of the question, say so, and return no citations. Partial evidence is useful: state what it establishes, what remains unknown, and retain its citations.

# Legacy aliases make this file mechanically projectable for config/1 and /2
# compatibility qualification; config/3 consumes the typed bindings above.
role.advisory = gemini-generate
role.extractor = gemini-generate
role.embedding = gemini-embed
role.answerer = gemini-generate

budget.minutes = 30
budget.item_limit = 100
budget.model_calls = 50
budget.input_tokens = 100000
budget.output_tokens = 50000
budget.cost_microunits = 2000000

worker.processes = 1
worker.max_in_flight = 1
worker.lease_seconds = 120
worker.poll_ms = 100
worker.guided_deadline_seconds = 0

vector.algorithm = ivf-flat-v1
vector.centroids = 16
vector.probes = 4
vector.iterations = 2
vector.recall_minimum_millionths = 900000
vector.maximum_rows = 1000000
vector.maximum_sidecar_bytes = 67108864
vector.embedding_maximum_items = 100000

retrieval.lexical_candidates = 48
retrieval.vector_candidates = 12
retrieval.vector_scan_limit = 100000
retrieval.graph_hops = 3
retrieval.passage_limit = 12
retrieval.claim_limit = 8
retrieval.lead_limit = 8
retrieval.rrf_k = 60
retrieval.graph_boost_millionths = 2000
retrieval.graph_decay_millionths = 750000
retrieval.directness_bonus_millionths = 1000
retrieval.graph_direction = both
retrieval.maximum_evidence_bytes = 262144

maintenance.sparse_max_degree = 1
maintenance.query_gap_min_occurrences = 1
maintenance.batch_items = 1000

observation.capture_threshold = 50
observation.cooldown_seconds = 900
observation.maximum_staleness_seconds = 86400
observation.work_minimum_change = 25
observation.work_relative_millionths = 50000
observation.dead_letter_minimum_change = 25
observation.review_minimum_change = 10
observation.narrative_output_tokens = 4096

schedule.manual-maintenance.trigger = manual
schedule.manual-maintenance.operation = maintain.plan
schedule.manual-maintenance.enabled = true

