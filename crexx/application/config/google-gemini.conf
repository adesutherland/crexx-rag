# crexx-rag human configuration
# Current stable Google models verified against the official catalogue on 2026-08-24.
format = crexx-rag.config/2
config.id = google-gemini
config.version = 1
profiles = generic-profile,it-architecture-profile

source.architecture-docs.connector = folder
source.architecture-docs.root = ./source-docs
source.architecture-docs.include = **/*.md,**/*.txt,**/*.rexx,**/*.crexx
source.architecture-docs.stable_key = relative-path
source.architecture-docs.privacy = public
source.architecture-docs.retain_raw_artifact = true

provider.gemini-generate.kind = gemini
provider.gemini-generate.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-generate.model = gemini-3.5-flash-lite
provider.gemini-generate.route_class = hosted
provider.gemini-generate.privacy_policy = public-only
provider.gemini-generate.credential = env:GEMINI_API_KEY
provider.gemini-generate.timeout_ms = 60000
provider.gemini-generate.max_attempts = 1
provider.gemini-generate.requests_per_minute = 60
provider.gemini-generate.tokens_per_minute = 1000000
provider.gemini-generate.concurrent_requests = 2
provider.gemini-generate.initial_backoff_ms = 1000
provider.gemini-generate.maximum_backoff_ms = 60000
provider.gemini-generate.jitter_ms = 250

provider.gemini-embed.kind = gemini
provider.gemini-embed.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-embed.model = gemini-embedding-2
provider.gemini-embed.route_class = hosted
provider.gemini-embed.privacy_policy = public-only
provider.gemini-embed.credential = env:GEMINI_API_KEY
provider.gemini-embed.timeout_ms = 60000
provider.gemini-embed.max_attempts = 1
provider.gemini-embed.requests_per_minute = 60
provider.gemini-embed.tokens_per_minute = 1000000
provider.gemini-embed.concurrent_requests = 2
provider.gemini-embed.initial_backoff_ms = 1000
provider.gemini-embed.maximum_backoff_ms = 60000
provider.gemini-embed.jitter_ms = 250

role.advisory = gemini-generate
role.extractor = gemini-generate
role.embedding = gemini-embed
role.answerer = gemini-generate

budget.minutes = 30
budget.item_limit = 100
budget.model_calls = 50
budget.input_tokens = 100000
budget.output_tokens = 50000
budget.cost_microunits = 2000000

worker.processes = 1
worker.max_in_flight = 1
worker.lease_seconds = 120

vector.algorithm = ivf-flat-v1
vector.centroids = 16
vector.probes = 4
vector.iterations = 2
vector.recall_minimum_millionths = 900000

retrieval.lexical_candidates = 48
retrieval.vector_candidates = 12
retrieval.vector_scan_limit = 100000
retrieval.graph_hops = 3
retrieval.passage_limit = 12
retrieval.claim_limit = 8
retrieval.lead_limit = 8
retrieval.rrf_k = 60
retrieval.graph_boost_millionths = 2000
retrieval.graph_decay_millionths = 750000
retrieval.directness_bonus_millionths = 1000
retrieval.graph_direction = both

maintenance.sparse_max_degree = 1
maintenance.query_gap_min_occurrences = 1

observation.capture_threshold = 50
observation.cooldown_seconds = 900
observation.maximum_staleness_seconds = 86400
observation.work_minimum_change = 25
observation.work_relative_millionths = 50000
observation.dead_letter_minimum_change = 25
observation.review_minimum_change = 10

schedule.manual-maintenance.trigger = manual
schedule.manual-maintenance.operation = maintain.plan
schedule.manual-maintenance.enabled = true
