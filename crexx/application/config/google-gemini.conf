# crexx-rag human configuration
# Replace the model placeholders only after checking Google's current model catalogue.
format = crexx-rag.config/1
config.id = google-gemini
config.version = 1
profiles = generic-profile,it-architecture-profile

source.architecture-docs.connector = folder
source.architecture-docs.root = ./source-docs
source.architecture-docs.include = **/*.md,**/*.txt,**/*.rexx,**/*.crexx
source.architecture-docs.stable_key = relative-path
source.architecture-docs.privacy = public
source.architecture-docs.retain_raw_artifact = true

provider.gemini-generate.kind = gemini
provider.gemini-generate.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-generate.model = replace-with-current-google-generation-model
provider.gemini-generate.route_class = hosted
provider.gemini-generate.privacy_policy = public-only
provider.gemini-generate.credential = env:GEMINI_API_KEY
provider.gemini-generate.timeout_ms = 60000
provider.gemini-generate.max_attempts = 2

provider.gemini-embed.kind = gemini
provider.gemini-embed.base_url = https://generativelanguage.googleapis.com/v1beta
provider.gemini-embed.model = replace-with-current-google-embedding-model
provider.gemini-embed.route_class = hosted
provider.gemini-embed.privacy_policy = public-only
provider.gemini-embed.credential = env:GEMINI_API_KEY
provider.gemini-embed.timeout_ms = 60000
provider.gemini-embed.max_attempts = 2

role.advisory = gemini-generate
role.extractor = gemini-generate
role.embedding = gemini-embed

budget.minutes = 30
budget.item_limit = 100
budget.model_calls = 50
budget.input_tokens = 100000
budget.output_tokens = 50000
budget.cost_microunits = 2000000

worker.processes = 1
worker.max_in_flight = 1
worker.lease_seconds = 120

schedule.manual-improvement.trigger = manual
schedule.manual-improvement.enabled = true
