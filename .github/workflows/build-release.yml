name: Build and package cREXX-RAG

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rag-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      crexx: ${{ steps.identity.outputs.crexx }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check release contracts
        run: bash tests/release/test_packaging.sh
      - id: identity
        name: Freeze build identities
        shell: bash
        run: bash scripts/release/metadata.sh

  build:
    needs: metadata
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: macos-x86_64
            os: macos-15-intel
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: windows-x64
            os: windows-2025
            cmake_args: -DCMAKE_CXX_COMPILER=cl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: '14.44'
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis jq --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
      - name: Compile the Windows installer fixture before building dependencies
        if: runner.os == 'Windows'
        run: bash tests/release/test_nsis.sh
      - name: Install verified CREXX 1.0.0-beta.3 binaries
        env:
          CREXX_COMMIT: ${{ needs.metadata.outputs.crexx }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          case "$RELEASE_PLATFORM" in
            macos-arm64)
              core=CREXX-v1.0.0-beta.3-macos-arm64.zip
              core_sha=2b865862f75c07ee94b0d84b77d58c39f5f418c0b24f88a86e1a612fe195fa43
              llama=llama.rexx-v1.0.0-beta.3-macos-arm64-metal.zip
              llama_sha=fe4f14ed14317c8ba727a7f41d5fcc055323499ffb514b93c4110ea1b27a4133
              backend=metal ;;
            macos-x86_64)
              core=CREXX-v1.0.0-beta.3-macos-x86_64.zip
              core_sha=653f98cd24a28720ef6c7d074649afd5306dbafb25eb8ce316a176856799d974
              llama=llama.rexx-v1.0.0-beta.3-macos-x86_64-cpu.zip
              llama_sha=7091f57e2b5edb321cf5ad96b31f464ea4ad76678b34bd1b4fbe12bac9889d51
              backend=cpu ;;
            windows-x64)
              core=CREXX-v1.0.0-beta.3-windows-x64-signed.zip
              core_sha=bb83bda9545c7506592a1d1c71d1f1110b6da65b7431255afd64722aaebab539
              llama=llama.rexx-v1.0.0-beta.3-windows-x64-vulkan-signed.zip
              llama_sha=5f605f362b343c75791a72e188da481be109550ab2b718eac5a73530fc0c1994
              backend=vulkan ;;
            *) exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/crexx-download" "$RUNNER_TEMP/crexx-sdk"
          for asset in "$core" "$llama"; do
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/crexx-download/$asset" \
              "https://github.com/adesutherland/CREXX/releases/download/v1.0.0-beta.3/$asset"
          done
          hash_asset() {
            if command -v sha256sum >/dev/null; then
              sha256sum -b < "$1" | cut -d ' ' -f1
            else
              shasum -a 256 < "$1" | cut -d ' ' -f1
            fi
          }
          test "$(hash_asset "$RUNNER_TEMP/crexx-download/$core")" = "$core_sha"
          test "$(hash_asset "$RUNNER_TEMP/crexx-download/$llama")" = "$llama_sha"
          unzip -q "$RUNNER_TEMP/crexx-download/$core" -d "$RUNNER_TEMP/crexx-sdk"
          unzip -qo "$RUNNER_TEMP/crexx-download/$llama" -d "$RUNNER_TEMP/crexx-sdk"
          prefix="$RUNNER_TEMP/crexx-sdk/CREXX-$RELEASE_PLATFORM"
          test "$(sed -n 's/^commit=//p' "$prefix/BUILDINFO" | tr -d '\r')" = "$CREXX_COMMIT"
          test "$(sed -n 's/^version=//p' "$prefix/BUILDINFO" | tr -d '\r')" = 1.0.0-beta.3
          jq -e --arg commit "$CREXX_COMMIT" --arg platform "$RELEASE_PLATFORM" --arg backend "$backend" \
            '.commit == $commit and .platform == $platform and .backend == $backend' \
            "$prefix/llama-package.json"
          cp "$prefix/LICENSE" "$prefix/CREXX-LICENSE"
      - name: Select the pinned cREXX driver for release scripts
        run: echo "$RUNNER_TEMP/crexx-sdk/CREXX-${{ matrix.platform }}/bin" >> "$GITHUB_PATH"
      - name: Configure and build RAG against the installed SDK
        run: |
          build_jobs=4
          echo "Building RAG with $build_jobs compiler workers"
          cmake -S . -B "$RUNNER_TEMP/rag-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCREXXRAG_CREXX_BINARY_PREFIX="$RUNNER_TEMP/crexx-sdk/CREXX-${{ matrix.platform }}" \
            -DCREXXRAG_BUILD_TESTS=OFF -DCREXXRAG_REXX_BUILD_JOBS="$build_jobs" \
            ${{ matrix.cmake_args }}
          cmake --build "$RUNNER_TEMP/rag-build" --parallel "$build_jobs"
          cmake --install "$RUNNER_TEMP/rag-build" --prefix "$RUNNER_TEMP/rag-payload"
          cp "$RUNNER_TEMP/crexx-sdk/CREXX-${{ matrix.platform }}/CREXX-LICENSE" "$RUNNER_TEMP/rag-payload/CREXX-LICENSE"
      - name: Package installers and portable ZIPs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          CREXX_COMMIT: ${{ needs.metadata.outputs.crexx }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          # PR builds receive no signing credentials, including same-repository PRs.
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 || '' }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 || '' }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD || '' }}
          APPLE_DEVELOPER_ID_INSTALLER_IDENTITY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_TEAM_ID || '' }}
        run: |
          crexx -nokeep scripts/release/package.crexx --args package --prefix "$RUNNER_TEMP/rag-payload" \
            --output "$RUNNER_TEMP/release-assets" --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" --crexx-commit "$CREXX_COMMIT" --platform "$RELEASE_PLATFORM"
      - name: Verify the actual portable ZIP
        run: |
          for archive in "$RUNNER_TEMP/release-assets/"*.zip; do
            crexx -nokeep scripts/release/smoke.crexx --args --archive "$archive"
          done
      - name: Test Windows installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/release-assets/*-setup.exe")
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          & ./scripts/release/test-windows-installer.ps1 -Installer $installer[0].FullName
      - name: Test macOS installer on the disposable runner
        if: runner.os == 'macOS'
        run: |
          for installer in "$RUNNER_TEMP/release-assets/"*.pkg; do
            sudo installer -pkg "$installer" -target /
          done
          test -L /usr/local/bin/crexxrag
          crexx -nokeep scripts/release/smoke.crexx --args --prefix /usr/local/lib/crexxrag
      - name: Retain verified installers
        uses: actions/upload-artifact@v7
        with:
          name: crexxrag-${{ matrix.platform }}-${{ needs.metadata.outputs.commit }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.platform }}-${{ needs.metadata.outputs.commit }}
          path: |
            ${{ runner.temp }}/rag-build/crexxrag-native/package/native-build.txt
            ${{ runner.temp }}/rag-build/CMakeCache.txt
            ${{ runner.temp }}/crexx-sdk/CREXX-${{ matrix.platform }}/BUILDINFO
          if-no-files-found: ignore

  publish:
    needs: [metadata, build]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: crexxrag-*-${{ needs.metadata.outputs.commit }}
          merge-multiple: true
          path: release-assets
      - name: Publish the verified installer set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" \
            --verify-tag --title "cREXX-RAG $RELEASE_TAG" --generate-notes "${prerelease[@]}"
