format = crexx-rag.config/1
config.id = tutorial-codex-local
config.version = 1
profiles = it-architecture-profile

source.architecture-docs.connector = folder
source.architecture-docs.root = ./source-docs
source.architecture-docs.include = **/*.txt
source.architecture-docs.stable_key = relative-path
source.architecture-docs.privacy = public
source.architecture-docs.retain_raw_artifact = true

provider.codex-extract.kind = codex
provider.codex-extract.base_url = app-server://local
provider.codex-extract.model = default
provider.codex-extract.route_class = hosted
provider.codex-extract.privacy_policy = public-only
provider.codex-extract.credential = none
provider.codex-extract.timeout_ms = 120000
provider.codex-extract.max_attempts = 1

provider.local-embed.kind = openai-compatible
provider.local-embed.base_url = http://127.0.0.1:8081/v1
provider.local-embed.model = nomic-embed-text-v1.5
provider.local-embed.route_class = local
provider.local-embed.privacy_policy = restricted-ok
provider.local-embed.credential = none
provider.local-embed.timeout_ms = 60000
provider.local-embed.max_attempts = 1

role.advisory = codex-extract
role.extractor = codex-extract
role.embedding = local-embed
role.answerer = codex-extract

budget.minutes = 5
budget.item_limit = 2
budget.model_calls = 2
budget.input_tokens = 65536
budget.output_tokens = 1024
budget.cost_microunits = 0
budget.codex_turns = 1
budget.minimum_codex_allowance_percent = 10

worker.processes = 2
worker.max_in_flight = 1
worker.lease_seconds = 180

schedule.manual-improvement.trigger = manual
schedule.manual-improvement.enabled = true
