format = crexx-rag.config/2
config.id = tutorial-codex-local
config.version = 1
profiles = it-architecture-profile

source.architecture-docs.connector = folder
source.architecture-docs.root = ./source-docs
source.architecture-docs.include = **/*.txt
source.architecture-docs.stable_key = relative-path
source.architecture-docs.privacy = public
source.architecture-docs.retain_raw_artifact = true

discovery.mode = all
discovery.glossary_file = ./architecture.glossary.tsv
discovery.ranked_limit = 16
discovery.max_mentions = 16
discovery.max_relationships = 16
discovery.max_notes = 8

provider.codex-extract.kind = codex
provider.codex-extract.base_url = app-server://local
provider.codex-extract.model = default
provider.codex-extract.route_class = hosted
provider.codex-extract.privacy_policy = public-only
provider.codex-extract.credential = none
provider.codex-extract.timeout_ms = 120000
provider.codex-extract.max_attempts = 1
provider.codex-extract.requests_per_minute = 60
provider.codex-extract.tokens_per_minute = 2000000
provider.codex-extract.concurrent_requests = 1
provider.codex-extract.initial_backoff_ms = 1000
provider.codex-extract.maximum_backoff_ms = 60000
provider.codex-extract.jitter_ms = 250

provider.local-embed.kind = openai-compatible
provider.local-embed.base_url = http://127.0.0.1:8081/v1
provider.local-embed.model = nomic-embed-text-v1.5
provider.local-embed.route_class = local
provider.local-embed.privacy_policy = restricted-ok
provider.local-embed.credential = none
provider.local-embed.timeout_ms = 60000
provider.local-embed.max_attempts = 1
provider.local-embed.requests_per_minute = 60000
provider.local-embed.tokens_per_minute = 2000000000
provider.local-embed.concurrent_requests = 2
provider.local-embed.initial_backoff_ms = 100
provider.local-embed.maximum_backoff_ms = 5000
provider.local-embed.jitter_ms = 25

role.advisory = codex-extract
role.extractor = codex-extract
role.embedding = local-embed
role.answerer = codex-extract

budget.minutes = 5
budget.item_limit = 2
budget.model_calls = 2
budget.input_tokens = 65536
budget.output_tokens = 4096
budget.cost_microunits = 0
budget.codex_turns = 1
budget.minimum_codex_allowance_percent = 10

worker.processes = 2
worker.max_in_flight = 1
worker.lease_seconds = 180

vector.algorithm = ivf-flat-v1
vector.centroids = 16
vector.probes = 4
vector.iterations = 2
vector.recall_minimum_millionths = 900000

retrieval.lexical_candidates = 48
retrieval.vector_candidates = 12
retrieval.vector_scan_limit = 100000
retrieval.graph_hops = 3
retrieval.passage_limit = 12
retrieval.claim_limit = 8
retrieval.lead_limit = 8
retrieval.rrf_k = 60
retrieval.graph_boost_millionths = 2000
retrieval.graph_decay_millionths = 750000
retrieval.directness_bonus_millionths = 1000
retrieval.graph_direction = both
retrieval.maximum_evidence_bytes = 262144

maintenance.sparse_max_degree = 1
maintenance.query_gap_min_occurrences = 1
maintenance.batch_items = 1000

observation.capture_threshold = 50
observation.cooldown_seconds = 900
observation.maximum_staleness_seconds = 86400
observation.work_minimum_change = 25
observation.work_relative_millionths = 50000
observation.dead_letter_minimum_change = 25
observation.review_minimum_change = 10
observation.narrative_output_tokens = 4096

schedule.manual-maintenance.trigger = manual
schedule.manual-maintenance.operation = maintain.plan
schedule.manual-maintenance.enabled = true
