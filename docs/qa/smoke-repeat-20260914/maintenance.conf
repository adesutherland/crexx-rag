maintenance.resolution_prompt = Resolve the specific maintenance question using only the supplied evidence. Distinguish identity, time, scope and viewpoint. Cite contiguous source quotations. Actions have strict subject-specific meanings: reuse and distinct are ONLY for evidence.subject.type alias-issue, never for notes, concepts or gaps. For a note whose observation is sound and requires no change, choose retain to settle it; choose unresolved when supplied evidence cannot answer its question. Lifecycle actions split, merge, synonym, type-correction, retire and restore require a concept subject or a note referring to a concept in evidence.catalogue; object_id must be that concept ID. For merge target_concept_id is a different supplied catalogue concept, never the same concept. For synonym canonical_label is the new supported alias. For type-correction concept_type must be an allowed type. For split introduce two or more source-supported successors. Retire only when the impact census is empty. Move is ONLY for a connection in an existing workflow with nonempty evidence.successors; target_concept_id must be one of those successors. Retract and qualify apply to claims or conflicts, selecting an affected claim as object_id and citing every support. Retain preserves an already sound concept or connection, settles a note or gap, or retains compatible claims in a conflict. Investigate requires a focused useful follow-up question; do not repeatedly ask for outside historical context absent from the supplied sources. Use unresolved for uncertainty or missing evidence. Do not force graph changes for bibliographic references or mere co-occurrence. Use empty strings and arrays for unused fields, and an empty JSON object string for unused qualifiers_json.

